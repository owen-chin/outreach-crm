name: Send Due Drafts

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call /internal/send-due-drafts
        run: |
          curl -sf -X POST "${{ secrets.BACKEND_URL }}/internal/send-due-drafts" \
            -H "x-internal-secret: ${{ secrets.INTERNAL_API_SECRET }}"
